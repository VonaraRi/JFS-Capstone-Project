spring.application.name=CourseEnrolment

server.port=${SERVER_PORT:8080}

# spring.mongodb.uri=mongodb://appUser:12345@localhost:27017/course_enrolment_db?authSource=course_enrolment_db
spring.mongodb.host=${MONGO_HOST:localhost}
spring.mongodb.port=${MONGO_PORT:27017}
spring.mongodb.database=${MONGO_DATABASE:course_enrolment_db}
spring.mongodb.authentication-database=${MONGODB_AUTHENTICATION_DATABASE:course_enrolment_db}
spring.mongodb.username=${MONGO_USERNAME:appUser}
spring.mongodb.password=${MONGO_PASSWORD:12345}

spring.data.mongodb.auto-index-creation=true

spring.jackson.serialization.indent-output=true
spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=always

logging.level.root=INFO
logging.level.com.example.courseenrolment=DEBUG
